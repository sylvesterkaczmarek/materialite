name: Exact-source regression validation
on:
  push:
    branches:
      - 'validation/dream3d-feature-id-indexing-20260927'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    env:
      MPLBACKEND: Agg
      OPENMDAO_REPORTS: '0'
      PYVISTA_OFF_SCREEN: 'true'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: sylvesterkaczmarek/materialite
          ref: 'd6d0b8cd569094c1b51cf36d86d59281e66c728d'
          path: work
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install validation dependencies
        run: |
          python -m pip install -e ./work pytest==9.1.1 pytest-mock pytest-cov build black isort ruff numpy==2.5.3 pandas==3.0.6 scipy==1.18.1 h5py==3.16.0 pyvista==0.49.0 vtk==9.7.0
      - name: Verify source, original failures and installed package
        run: python validation/verify.py work evidence
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: evidence-${{ matrix.python }}
          path: evidence
          retention-days: 14
